[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techquest-mcp-ehr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-ehr = "mcp_ehr.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ehr"]