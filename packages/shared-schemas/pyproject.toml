[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-schemas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "langchain-core>=0.1.0",
    "langgraph>=1.2.11",
    "typing-extensions>=4.16.0",
]

[tool.setuptools.packages.find]
where = ["."]