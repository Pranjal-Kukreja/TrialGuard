[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techquest-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "shared-schemas",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "google-genai>=2.22.0",
    "pydantic>=2.13.5",
]

[tool.uv.sources]
shared-schemas = { workspace = true }

[tool.setuptools]
py-modules = ["graph", "checkpointer"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodes*", "edges*", "tests*"]
