[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techquest-agent-master"
version = "0.1.0"
description = "Master coordinator and unified A2A gateway for TrialGuard"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "shared-schemas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
